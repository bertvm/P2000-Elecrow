[env:elecrow_esp32s3_5in]
# Arduino_GFX's ESP32 RGB panel backend requires Arduino-ESP32 2.x.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
# DIS07050H has 4 MB flash + 8 MB octal PSRAM (ESP32-S3-WROOM-1-N4R8).
# Keep these separate: qio_opi configures the RAM, but the module itself has
# only 4 MB flash. The RGB framebuffer lives in PSRAM.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 4MB
board_build.partitions = default.csv
lib_deps =
  ; The 5-inch RGB panel and Arduino-ESP32 2.x need this exact release:
  ; 1.6.1 has an ESP32-S3 RGB framebuffer regression; 1.6.2+ needs core 3.x.
  moononournation/GFX Library for Arduino@1.6.0
  https://github.com/TAMCTec/gt911-arduino.git
  bblanchon/ArduinoJson@^7.2.1
# Use UART0 for Serial diagnostics; it is the same port that shows ESP-ROM logs.
